<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเบิกอะไหล่ - Requisition History</title>
    <link rel="icon" href="./ChatGPT Image 17 ก.ค. 2569 12_42_50.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        p, h1, h2, h3, h4, h5, h6, span, a, button, input, textarea {
            font-family: 'Mitr', sans-serif !important;
            font-weight: 400;

        }
    </style>

    <style>
        /* ==========================================
           1. RESET & GENERAL STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px 5%;
        }

        /* Top Header Navbar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a252f;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .btn-back {
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-back:hover { 
            background-color: #95a5a6; 
        }

        /* Content Container */
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e1e8ed;
        }

        /* Search & Filter Bar */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 300px;
            max-width: 100%;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-clear:hover { 
            background-color: #c0392b; 
        }

        /* ==========================================
           2. HISTORY TABLE STYLES
           ========================================== */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        th, td {
            border: 1px solid #e1e8ed;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f4f6;
        }

        .part-num {
            font-family: monospace;
            font-weight: bold;
            color: #2980b9;
            background-color: #ebf5fb;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .badge-qty {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
        }

        .badge-loc {
            background-color: #27ae60;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .time-text {
            color: #7f8c8d;
            font-size: 0.85rem;
        }
    </style>
</head>

    <style>
        body{
            background-image: url('ChatGPT Image.png');
            background-size: cover;
            background-position: center;
        }
    </style>

<body>

    <!-- TOP NAV / HEADER -->
    <header class="top-bar">
        <!-- ปุ่มย้อนกลับไปหน้า Navbar หลัก -->
        <a href="index.html" class="btn-back">⬅️ ย้อนกลับไปหน้า Navbar</a>
        <h2>📜 ประวัติการเบิกอะไหล่ทั้งหมด</h2>
        <div></div>
    </header>

    <!-- MAIN CONTENT CARD -->
    <main class="card">
        <!-- แถบการค้นหาและปุ่มจัดการ -->
        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาตามชื่อผู้เบิก, Part Number..." onkeyup="filterHistory()">
            <button class="btn-clear" onclick="clearHistory()">🗑️ ล้างประวัติทั้งหมด</button>
        </div>

        <!-- ตารางแสดงประวัติ -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 5%;">#</th>
                        <th style="width: 20%;">ชื่อผู้เบิก</th>
                        <th style="width: 15%;">PART NUMBER</th>
                        <th style="width: 25%;">DESCRIPTION</th>
                        <th style="width: 10%;">จำนวนที่เบิก</th>
                        <th style="width: 12%;">ตำแหน่งที่เก็บ</th>
                        <th style="width: 13%;">วัน / เวลาที่เบิก</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- ข้อมูลจะถูกเรนเดอร์ผ่าน JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ดึงประวัติการเบิกจาก localStorage (ที่ถูกเซฟมาจากหน้าเบิกอะไหล่)
        let reqHistory = JSON.parse(localStorage.getItem('reqHistory')) || [];

        // เรนเดอร์ข้อมูลเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            renderHistoryTable(reqHistory);
        };

        // ฟังก์ชันสำหรับสร้างแถวตารางแสดงผล
        function renderHistoryTable(data) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 30px; color: #7f8c8d;">
                            🚫 ยังไม่มีประวัติการเบิกอะไหล่ในระบบ
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>👤 ${item.requester}</strong></td>
                    <td><span class="part-num">${item.partNum}</span></td>
                    <td>${item.desc}</td>
                    <td><span class="badge-qty">-${item.qty}</span></td>
                    <td><span class="badge-loc">📍 ${item.location}</span></td>
                    <td><span class="time-text">🕒 ${item.datetime}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ฟังก์ชันค้นหา/กรองข้อมูลประวัติ
        function filterHistory() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filteredData = reqHistory.filter(item => {
                return item.requester.toLowerCase().includes(query) ||
                       item.partNum.toLowerCase().includes(query) ||
                       item.desc.toLowerCase().includes(query) ||
                       item.location.toLowerCase().includes(query);
            });
            renderHistoryTable(filteredData);
        }

        // ฟังก์ชันล้างประวัติการเบิกทั้งหมด
        function clearHistory() {
            if (reqHistory.length === 0) return alert('ไม่มีประวัติให้ล้าง!');

            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการเบิกทั้งหมด? (การดำเนินการนี้ไม่สามารถย้อนกลับได้)')) {
                reqHistory = [];
                localStorage.removeItem('reqHistory');
                renderHistoryTable(reqHistory);
            }
        }
    </script>
</body>
</html>
