<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเบิกอะไหล่ - Parts Requisition</title>
    <link rel="icon" href="./ChatGPT Image 17 ก.ค. 2569 12_42_50.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        p, h1, h2, h3, h4, h5, h6, span, a, button, input, textarea, div {
            font-family: 'Mitr', sans-serif !important;
            font-weight: 400;

        }
    </style>

    <style>
        /* ==========================================
           1. RESET & GENERAL STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px 5%;
        }

        /* Top Navigation Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a252f;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .btn-back {
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-back:hover { background-color: #95a5a6; }

        /* Container Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e1e8ed;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .stock-info {
            font-size: 0.85rem;
            color: #e67e22;
            margin-top: 4px;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover { background-color: #c0392b; }

        /* Table Styles */
        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e1e8ed;
            padding: 10px;
            text-align: left;
            font-size: 0.85rem;
        }

        th { background-color: #ecf0f1; color: #2c3e50; }

        .badge-out {
            background-color: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
    </style>
</head>

    <style>
        body{
            background-image: url('ChatGPT Image.png');
            background-size: cover;
            background-position: center;
        }
    </style>

<body>

    <!-- TOP HEADER / NAVBAR LINK -->
    <header class="top-bar">
        <a href="index.html" class="btn-back">⬅️ ย้อนกลับไปหน้า Navbar</a>
        <h2>📋 ระบบเบิกอะไหล่ (Parts Requisition)</h2>
        <div></div>
    </header>

    <div class="container">
        <!-- ฝั่งซ้าย: ฟอร์มกรอกข้อมูลการเบิก -->
        <section class="card">
            <h3>📝 ฟอร์มบันทึกการเบิกอะไหล่</h3>
            <form id="requisitionForm" onsubmit="handleRequisition(event)">
                
                <div class="form-group">
                    <label for="requesterName">ชื่อผู้เบิก *</label>
                    <input type="text" id="requesterName" placeholder="ระบุชื่อ-นามสกุล ผู้เบิก" required>
                </div>

                <div class="form-group">
                    <label for="categorySelect">หมวดหมู่ *</label>
                    <select id="categorySelect" onchange="onCategoryChange()" required>
                        <option value="">-- เลือกหมวดหมู่ --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="partSelect">รายการอะไหล่ *</label>
                    <select id="partSelect" onchange="onPartChange()" required disabled>
                        <option value="">-- กรุณาเลือกหมวดหมู๋ก่อน --</option>
                    </select>
                    <div id="stockNotice" class="stock-info"></div>
                </div>

                <div class="form-group">
                    <label for="reqQty">จำนวนที่ต้องการเบิก *</label>
                    <input type="number" id="reqQty" min="1" value="1" required disabled>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit" disabled>ยืนยันการเบิกอะไหล่</button>
            </form>
        </section>

        <!-- ฝั่งขวา: ตารางประวัติการเบิก -->
        <section class="card">
            <h3>📜 ประวัติการเบิกอะไหล่</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ผู้เบิก</th>
                            <th>Part Number</th>
                            <th>Description</th>
                            <th>จำนวน</th>
                            <th>ตำแหน่ง</th>
                            <th>วัน/เวลาที่เบิก</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- รายการประวัติจะถูกเรนเดอร์ผ่าน JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ดึงข้อมูลคลังอะไหล่และประวัติการเบิกจาก localStorage
        let partsData = JSON.parse(localStorage.getItem('partsData')) || [];
        let reqHistory = JSON.parse(localStorage.getItem('reqHistory')) || [];

        // โหลดข้อมูลหมวดหมู่เมื่อเปิดหน้าเว็บ
        window.onload = function() {
            populateCategories();
            renderHistory();
        };

        // 1. นำรายชื่อหมวดหมู่มาใส่ใน Select
        function populateCategories() {
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';

            partsData.forEach((cat, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = cat.name;
                catSelect.appendChild(opt);
            });
        }

        // 2. เมื่อมีการเปลี่ยนหมวดหมู่ ให้ดึงรายการอะไหล่ในหมวดนั้นมาใส่
        function onCategoryChange() {
            const catIndex = document.getElementById('categorySelect').value;
            const partSelect = document.getElementById('partSelect');
            const reqQty = document.getElementById('reqQty');
            const btnSubmit = document.getElementById('btnSubmit');
            const stockNotice = document.getElementById('stockNotice');

            partSelect.innerHTML = '<option value="">-- เลือกรายการอะไหล่ --</option>';
            stockNotice.innerText = '';

            if (catIndex === "") {
                partSelect.disabled = true;
                reqQty.disabled = true;
                btnSubmit.disabled = true;
                return;
            }

            const items = partsData[catIndex].items;
            if (items.length === 0) {
                partSelect.innerHTML = '<option value="">ไม่มีรายการอะไหล่ในหมวดนี้</option>';
                partSelect.disabled = true;
                reqQty.disabled = true;
                btnSubmit.disabled = true;
                return;
            }

            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                // ถ้าจำนวน = 0 ให้ขึ้นต่อท้ายว่า (สินค้าหมด)
                const statusText = item.qty === 0 ? ' [สินค้าหมด]' : ` (คงเหลือ: ${item.qty})`;
                opt.textContent = `${item.partNum} - ${item.desc}${statusText}`;
                if (item.qty === 0) opt.disabled = true; // ล็อคไม่ให้เลือกตัวที่หมด
                partSelect.appendChild(opt);
            });

            partSelect.disabled = false;
        }

        // 3. เมื่อเลือกรายการอะไหล่ ตรวจสอบจำนวนสต็อกคงเหลือ
        function onPartChange() {
            const catIndex = document.getElementById('categorySelect').value;
            const partIndex = document.getElementById('partSelect').value;
            const reqQty = document.getElementById('reqQty');
            const btnSubmit = document.getElementById('btnSubmit');
            const stockNotice = document.getElementById('stockNotice');

            if (partIndex === "") {
                reqQty.disabled = true;
                btnSubmit.disabled = true;
                stockNotice.innerText = '';
                return;
            }

            const selectedPart = partsData[catIndex].items[partIndex];
            
            if (selectedPart.qty === 0) {
                stockNotice.innerHTML = '<span class="badge-out">สินค้าหมด</span> ไม่สามารถเบิกได้';
                reqQty.disabled = true;
                btnSubmit.disabled = true;
            } else {
                stockNotice.innerText = `จำนวนคงเหลือในคลัง: ${selectedPart.qty} ชิ้น (ตำแหน่ง: ${selectedPart.location})`;
                reqQty.max = selectedPart.qty;
                reqQty.value = 1;
                reqQty.disabled = false;
                btnSubmit.disabled = false;
            }
        }

        // 4. บันทึกการเบิก และตัดจำนวนสต็อก
        function handleRequisition(e) {
            e.preventDefault();

            const requesterName = document.getElementById('requesterName').value.trim();
            const catIndex = document.getElementById('categorySelect').value;
            const partIndex = document.getElementById('partSelect').value;
            const qtyToReq = parseInt(document.getElementById('reqQty').value);

            const targetPart = partsData[catIndex].items[partIndex];

            // ตรวจสอบความถูกต้องของจำนวน
            if (qtyToReq > targetPart.qty) {
                alert('จำนวนที่เบิกเกินกว่าที่มีในคลัง!');
                return;
            }

            // ตัดสต็อกในคลัง
            targetPart.qty -= qtyToReq;

            // บันทึกเวลาที่ทำการเบิก
            const now = new Date();
            const timeString = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            // สร้าง Record ประวัติการเบิก
            const record = {
                requester: requesterName,
                partNum: targetPart.partNum,
                desc: targetPart.desc,
                qty: qtyToReq,
                location: targetPart.location,
                datetime: timeString
            };

            // อัปเดตประวัติการเบิกลงใน Array
            reqHistory.unshift(record); // ใส่ไว้หน้าสุด

            // เซฟกลับลง localStorage ทั้งข้อมูลอะไหล่ใหม่ และประวัติการเบิก
            localStorage.setItem('partsData', JSON.stringify(partsData));
            localStorage.setItem('reqHistory', JSON.stringify(reqHistory));

            alert('บันทึกการเบิกเรียบร้อยแล้ว!');

            // รีเซ็ตฟอร์มและอัปเดตหน้าจอ
            document.getElementById('requisitionForm').reset();
            onCategoryChange();
            renderHistory();
        }

        // 5. แสดงประวัติการเบิกในตาราง
        function renderHistory() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if (reqHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777;">ยังไม่มีประวัติการเบิกอะไหล่</td></tr>`;
                return;
            }

            reqHistory.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.requester}</strong></td>
                    <td>${item.partNum}</td>
                    <td>${item.desc}</td>
                    <td><span style="color:#e74c3c; font-weight:bold;">-${item.qty}</span></td>
                    <td>${item.location}</td>
                    <td><small style="color:#666;">${item.datetime}</small></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
